<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="main-box">
                    <h2 class="text-center mb-4">My To-Do List</h2>
                    <div id="taskList"></div>
                    <button class="btn  w-100 mt-3 bg-lavender" onclick="showForm()">Add Task</button>
                </div>
            </div>
            <div class="col-md-4 d-none" id="formSection">
                <div class="main-box">
                    <h3 class="text-center mb-4">Add Task</h3>
                    <input type="text" id="taskInput"
                        class="form-control mb-3"
                        placeholder="Enter your task">
                    <button class="btn bg-lavender w-100" onclick="addTask()">Add</button>
                    <button class="btn bg-lavender1 w-100 mt-2" onclick="hideForm()">Cancel</button>
                </div>
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
